cluster:
  name: "gpu-test-cluster"
  deploy_user: "root"


jumphost:
  host: "10.243.128.6"
  port: 22
  auth:
    type: "key"
    username: "root"
    # password: "To.syhmARxhyIEiL"
    private_key: "~/.ssh/id_rsa"
    # node_auth:
    #   type: "key"
    #   username: "root"
    #   password: "taL1eqvYiv.fmI7o"


node_batch:
  enabled: true
  auth_template:            # 登录用户配置
    username: "root"
    private_key: "~/.ssh/id_rsa"  
  # 方式1：使用hosts文件格式
  hosts_file: "hosts"  # 相对路径，基于config目录

  # 方式2：直接提供hosts内容
  # hosts_content: |
  #   10.243.128.6 wqd10nbh06c6
  #   10.243.129.42 wqd10nbj05g1

  roles:
    - gpu_node
    - test_compile           # 添加额外角色

# 覆盖批量节点中特定节点的配置
nodes_override:
  - hostname: "wqd10nbh06c6"
    roles:
      - nfs_server
      - cpu_node


