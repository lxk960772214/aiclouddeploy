nfs:
  enabled: true
  action: "unshare"  # share: 共享(挂载) | unshare: 取消共享(卸载)
  server: "wqd10nbh06c6"
  export_path: "/root/para"
  client_mount: "/root/para"


time_sync:
  server: "gpugpugpu2"
  timezone: "Asia/Shanghai"


ssh_key:
  enabled: true
  users:
    - root


deployment:
  parallel: true           # 是否并行执行步骤
  max_workers: 5           # 最大并行工作线程数
  timeout: 300             # 单步超时时间（秒）
  retry: 0                 # 失败重试次数
  continue_on_failure: false  # 失败后是否继续执行
