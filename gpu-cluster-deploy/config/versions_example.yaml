# 软件版本配置示例
# 使用方法: 复制此文件为 versions.yaml 并修改配置

# ============================================================
# 安装包管理说明
# ============================================================
# 支持两种模式获取安装包：
#
# 1. download_url: 在登录服务器下载
#    - 适合登录服务器有外网访问权限的场景
#    - 在登录服务器下载到 /tmp/ 目录
#    - 从登录服务器分发到各GPU节点
#    - 登录服务器同时是GPU节点时跳过本机传输
#
# 2. local_file: 从本机上传
#    - 适合本机已有安装包的场景
#    - 从本机上传到登录服务器 /tmp/ 目录
#    - 从登录服务器分发到各GPU节点
#    - 登录服务器同时是GPU节点时跳过本机传输
#
# 优先级: local_file > download_url > 默认路径(/tmp/{filename})
#
# 可选校验:
# - checksum: 文件校验和，格式 "sha256:xxx" 或 "md5:xxx"
# - file_size: 文件大小（字节），用于进度显示
# ============================================================

# CUDA配置
cuda:
  version: "13.0"
  toolkit_file: "cuda_13.0.0_580.65.06_linux.run"

  # 安装包位置（三选一，优先级从高到低）
  # 方式1: 从本地上传（支持相对路径，基于项目根目录 gpu-cluster-deploy/）
  # local_file: "packages/cuda_13.0.0_580.65.06_linux.run"
  # 也可以使用绝对路径:
  # local_file: "/opt/software/cuda_13.0.0_580.65.06_linux.run"

  # 方式2: 从URL下载（自动下载到跳转机，然后分发给所有节点）
  download_url: "https://developer.download.nvidia.com/compute/cuda/13.0.0/local_installers/cuda_13.0.0_580.65.06_linux.run"

  # 校验和（可选，用于验证下载文件完整性）
  # checksum: "sha256:abc123..."

  # 文件大小（可选，用于下载进度显示）
  # file_size: 4500000000

# NVIDIA驱动配置
nvidia_driver:
  version: "580.142"
  file: "NVIDIA-Linux-x86_64-580.142.run"
  local_file: "packages/NVIDIA-Linux-x86_64-580.142.run"

  # 安装包位置（三选一）
  # local_file: "packages/NVIDIA-Linux-x86_64-580.142.run"  # 相对路径（基于项目根目录）
  # local_file: "/opt/software/NVIDIA-Linux-x86_64-580.142.run"  # 绝对路径
  # download_url: "https://us.download.nvidia.com/XFree86/Linux-x86_64/580.142/NVIDIA-Linux-x86_64-580.142.run"

  # 校验和（可选）
  # checksum: "sha256:xxx"

  # 文件大小（可选）
  # file_size: 300000000

  # Fabric Manager 本地deb路径（可选，相对项目根目录或绝对路径）
  # 留空(null)则走step23在线下载；填了且文件存在则优先上传本地deb安装
  # 注意: deb版本需与本机nvidia驱动版本匹配（如580驱动配nvidia-fabricmanager_580.*.deb）
  # fabricmanager_local_file: "packages/nvidia-fabricmanager_580.142-1_amd64.deb"

# MLNX_OFED驱动配置
mlnx_ofed:
  version: "24.10-2.1.8.0"
  file: "MLNX_OFED_LINUX-24.10-2.1.8.0-ubuntu22.04-x86_64.tgz"
  enabled: false

  # 安装包位置（三选一）
  # local_file: "packages/MLNX_OFED_LINUX-24.10-2.1.8.0-ubuntu22.04-x86_64.tgz"  # 相对路径（基于项目根目录）
  # local_file: "/opt/software/MLNX_OFED_LINUX-24.10-2.1.8.0-ubuntu22.04-x86_64.tgz"  # 绝对路径
  # download_url: "https://content.mellanox.com/ofed/MLNX_OFED-24.10-2.1.8.0/MLNX_OFED_LINUX-24.10-2.1.8.0-ubuntu22.04-x86_64.tgz"

  # 校验和（可选）
  # checksum: "sha256:xxx"

# 内核配置
kernel:
  mode: "keep"              # keep | specify
  keep:
    lock_version: true      # 是否锁定当前内核版本
    update_grub: true       # 是否更新GRUB固定启动版本

# APT换源配置
apt_mirror:
  enabled: true             # 是否启用APT换源
  mirror: "tuna"            # 镜像源: tuna(清华) | aliyun(阿里) | ustc(中科大) | 自定义URL

# NCCL配置
nccl:
  enabled: true
  install_method: "local_file"  # local_file: 本地zip上传 | source: 克隆源码编译
  install_path: "/usr/local/nccl"
  compile_jobs: 8  # 编译并行进程数，null 表示自动(nproc)

# ============================================================
# 性能测试软件包配置
# ============================================================
test_packages:
  # 工具包本地目录（相对于项目根目录，或绝对路径）
  packages_dir: "packages"

  # 各测试工具包路径（相对于 packages_dir，或绝对路径）
  cublas_bench: "cublasMatmulBench"       # CUBLAS矩阵乘法基准测试
  gpu_burn: "gpu-burn-master.zip"          # GPU压力测试
  nccl: "nccl-master.zip"                 # NCCL源码包（编译NCCL库用），和上面的nccl是独立的，会检测toolkit_dir下有没有编译好的NCCL库，没有的话会编译
  nccl_tests: "nccl-tests-master.zip"      # NCCL通信性能测试
  openmpi: "openmpi-4.1.8.tar.gz"         # OpenMPI（多机NCCL测试需要）

  # 本地编译目录（避免NFS共享时多节点编译冲突）
  # 支持相对路径（基于项目根目录 gpu-cluster-deploy/），或绝对路径
  # 相对路径示例: "test_run/build" → /path/to/gpu-cluster-deploy/test_run/build
  # 绝对路径示例: "/tmp/gpu-test-build" 或 "/ssd/nfs/gpu-test-build"
  build_dir: "test_run/build"

  # 共享工具目录（可放在NFS上供所有节点使用）
  # 支持相对路径（基于项目根目录 gpu-cluster-deploy/），或绝对路径
  # 相对路径示例: "test_run/toolkit" → /path/to/gpu-cluster-deploy/test_run/toolkit
  # 绝对路径示例: "/ssd/nfs/gpu-test/toolkit" (NFS共享目录)
  toolkit_dir: "test_run/toolkit"

  # 测试结果目录
  # 支持相对路径（基于项目根目录 gpu-cluster-deploy/），或绝对路径
  result_dir: "test_run/result"

  # 编译日志目录
  # 支持相对路径（基于项目根目录 gpu-cluster-deploy/），或绝对路径
  log_dir: "test_run/logs"

  # GPU Burn 测试时长（秒）
  gpuburn_duration: 600

  # NCCL 测试数据大小
  # A100/H100/B200 等 PCIe 5.0 卡建议 8G
  # RTX5090/V100 等 建议 2G
  nccl_test_size: "2G"

  # 编译并行进程数，null 表示自动(nproc)
  compile_jobs: 8

  # 编译策略：
  # - local: 每个节点在本地 build_dir 独立编译（不推荐NFS环境）
  # - single_node: 只在第一个节点编译（默认）
  # - role_based: 根据 nodes.roles 中的 test_compile role 决定编译节点（推荐）
  compile_strategy: "role_based"
  
  # 编译角色名称（当compile_strategy=role_based时生效）
  # 节点需要在roles中添加此角色才会参与编译
  compile_role: "test_compile"
